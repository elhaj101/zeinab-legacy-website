name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # NEXT_PUBLIC_STATIC_EXPORT switches next.config.ts to `output: export`
      # (GitHub Pages has no server, so /api/apply and the proxy don't run —
      # see src/config/deployment.ts and ApplicationForm.tsx's fallback).
      # This is a temporary preview under Ali's own account; real hosting
      # (in Zeinab's name, with the form working) is still undecided.
      - run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"
      # next.config.ts writes the static site to out/. .nojekyll ships from
      # public/, which is what stops Pages' Jekyll step eating _next/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
